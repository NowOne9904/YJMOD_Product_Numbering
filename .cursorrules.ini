## 🚦 [Task Level Routing: 토큰 최적화 시스템]
사용자의 요청 난이도를 스스로 판단하거나 사용자가 지정한 레벨(Lv.1 ~ Lv.3)에 따라 아래의 출력 프로토콜을 엄수하여 불필요한 토큰 낭비를 막으십시오. (단, 어떤 레벨이든 코드는 생략 없이 '전체 코드'를 제공해야 합니다.)

- **Lv.1 (단순 수정 / UI 텍스트 변경)**
  - 행동: 스킬 허브 파일 참조를 생략하고 현재 열려있는 코드만 분석.
  - 출력: 인사말, 로직 설명, 요약 등 모든 부가 텍스트를 전면 생략하고 **수정된 전체 코드만 즉시 출력**.

- **Lv.2 (일반 로직 / 데이터 정제 추가)** [기본값]
  - 행동: `product_logic.md`만 핵심적으로 참조하여 정규식 및 규칙 확인.
  - 출력: 1~2줄의 짧은 변경 사유만 작성한 뒤 전체 코드 출력.

- **Lv.3 (새로운 API / 핵심 아키텍처 설계 / 버그 슈팅)**
  - 행동: 스킬 허브 내 모든 파일을 심층 분석 및 교차 검증.
  - 출력: 코드를 짜기 전 단계별 사고 과정(Step-by-step reasoning)과 검증 내역을 먼저 출력한 후, 최적화된 전체 코드 출력.